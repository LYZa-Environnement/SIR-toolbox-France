name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Les données de baignade sont collectées au build ; ce redéploiement
  # quotidien les tient à jour.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  # Lire les déploiements, pour annuler un déploiement Pages resté bloqué.
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Un calcul faux ne doit pas être publié.
      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE: ${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_bis.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Un déploiement Pages peut rester marqué « en cours » côté GitHub alors
      # qu'il a réussi, surtout quand deux publications s'enchaînent : tout
      # déploiement suivant est alors refusé (« Deployment request failed …
      # due to in progress deployment. Please cancel … first »). On annule
      # d'abord les déploiements précédents restés ouverts ; l'annulation
      # d'un déploiement terminé est refusée par l'API, sans effet.
      - name: Annuler un déploiement Pages resté bloqué
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[].sha' | awk '!vu[$0]++'); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "Déploiement $sha annulé"
            fi
          done

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Second essai, une minute plus tard, après une nouvelle annulation.
      - name: Annuler à nouveau avant le second essai
        if: steps.deployment.outcome == 'failure'
        run: |
          sleep 60
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[].sha' | awk '!vu[$0]++'); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "Déploiement $sha annulé"
            fi
          done

      - id: deployment_bis
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
